<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lapis — Baju & Jaket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a href="#" class="logo">Lapis</a>
  <nav>
    <a href="#produk">Produk</a>
    <a href="#kontak">Kontak</a>
    <button id="btnKeranjang" class="cart-btn" aria-label="Buka keranjang">Keranjang <span id="jumlah">0</span></button>
  </nav>
</header>

<section class="hero">
  <h1>Satu lapis lagi,<br>dan hari ini terasa pas.</h1>
  <p>Kaos, kemeja, hoodie, dan jaket untuk dipakai dari pagi sampai pulang malam.</p>
  <a href="#produk" class="btn">Lihat produk</a>
</section>

<section id="produk" class="produk">
  <div class="filter" id="filter">
    <button class="aktif" data-kat="semua">Semua</button>
    <button data-kat="baju">Baju</button>
    <button data-kat="jaket">Jaket</button>
  </div>
  <div class="grid" id="grid"></div>
</section>

<footer id="kontak">
  <p><strong>Lapis</strong> — pesan lewat WhatsApp di 0812-0000-0000 atau email halo@lapis.id</p>
  <p>Buka setiap hari, 09.00–21.00 WIB.</p>
</footer>

<div class="overlay" id="overlay"></div>
<aside class="panel" id="panel" aria-label="Keranjang belanja">
  <div class="panel-head">
    <h2>Keranjang</h2>
    <button id="tutup" aria-label="Tutup keranjang">✕</button>
  </div>
  <ul id="daftar"></ul>
  <div class="panel-foot">
    <div class="total"><span>Total</span><strong id="total">Rp0</strong></div>
    <button class="btn full" id="checkout">Pesan via WhatsApp</button>
  </div>
</aside>
<div class="toast" id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
