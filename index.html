<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lapis — Baju & Jaket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --kertas:#EEF1F4; --tinta:#1B2733; --biru:#2F5D8A; --kain:#D9A441; --putih:#fff; --garis:#cdd5dd;
  --serif:'Fraunces',Georgia,serif; --sans:'Work Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--kertas);color:var(--tinta);line-height:1.55}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--kain);outline-offset:2px}

.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:var(--kertas);border-bottom:1px solid var(--garis)}
.logo{font-family:var(--serif);font-weight:800;font-size:1.6rem}
nav{display:flex;gap:22px;align-items:center}
.cart-btn{background:var(--tinta);color:var(--putih);border:0;padding:8px 16px;border-radius:4px}
.cart-btn span{background:var(--kain);color:var(--tinta);border-radius:20px;padding:1px 8px;margin-left:6px;font-weight:600}

.hero{padding:12vh 5vw 9vh;max-width:900px}
.hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(2.2rem,6vw,4.4rem);line-height:1.05;letter-spacing:-.02em}
.hero p{margin:22px 0 30px;max-width:46ch;font-size:1.1rem}
.btn{display:inline-block;background:var(--biru);color:var(--putih);border:0;padding:13px 26px;border-radius:4px;font-weight:600}
.btn:hover{background:var(--tinta)}
.btn.full{width:100%}

.produk{padding:0 5vw 80px}
.filter{display:flex;gap:10px;margin-bottom:28px}
.filter button{background:transparent;border:1px solid var(--tinta);padding:7px 18px;border-radius:30px}
.filter .aktif{background:var(--tinta);color:var(--putih)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px}
.kartu{background:var(--putih);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.foto{aspect-ratio:4/5;display:grid;place-items:center;font-size:5rem}
.info{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{font-family:var(--serif);font-size:1.15rem}
.info small{color:#5b6b7a}
.harga{font-weight:600;margin-top:auto}
.ukuran{display:flex;gap:6px;margin:6px 0}
.ukuran button{border:1px solid var(--garis);background:var(--putih);padding:3px 10px;border-radius:3px;font-size:.85rem}
.ukuran .pilih{background:var(--tinta);color:var(--putih);border-color:var(--tinta)}
.tambah{background:var(--biru);color:var(--putih);border:0;padding:10px;border-radius:4px;font-weight:600}
.tambah:hover{background:var(--tinta)}

footer{background:var(--tinta);color:var(--kertas);padding:40px 5vw;display:grid;gap:6px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.overlay.buka{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;height:100%;width:min(400px,100%);background:var(--putih);z-index:30;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column}
.panel.buka{transform:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--garis)}
.panel-head h2{font-family:var(--serif)}
.panel-head button{background:none;border:0;font-size:1.2rem}
#daftar{list-style:none;flex:1;overflow:auto;padding:10px 20px}
#daftar li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:14px 0;border-bottom:1px solid var(--garis)}
#daftar .kosong{display:block;color:#5b6b7a;border:0}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:26px;height:26px;border:1px solid var(--garis);background:var(--putih);border-radius:3px}
.hapus{background:none;border:0;color:#a33;font-size:.85rem;justify-self:end}
.panel-foot{padding:20px;border-top:1px solid var(--garis);display:grid;gap:14px}
.total{display:flex;justify-content:space-between;font-size:1.1rem}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);background:var(--tinta);color:var(--putih);padding:10px 20px;border-radius:4px;opacity:0;transition:.3s;z-index:40}
.toast.tampil{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="topbar">
  <a href="#" class="logo">Lapis</a>
  <nav>
    <a href="#produk">Produk</a>
    <a href="#kontak">Kontak</a>
    <button id="btnKeranjang" class="cart-btn" aria-label="Buka keranjang">Keranjang <span id="jumlah">0</span></button>
  </nav>
</header>

<section class="hero">
  <h1>Satu lapis lagi,<br>dan hari ini terasa pas.</h1>
  <p>Kaos, kemeja, hoodie, dan jaket untuk dipakai dari pagi sampai pulang malam.</p>
  <a href="#produk" class="btn">Lihat produk</a>
</section>

<section id="produk" class="produk">
  <div class="filter" id="filter">
    <button class="aktif" data-kat="semua">Semua</button>
    <button data-kat="baju">Baju</button>
    <button data-kat="jaket">Jaket</button>
  </div>
  <div class="grid" id="grid"></div>
</section>

<footer id="kontak">
  <p><strong>Lapis</strong> — pesan lewat WhatsApp di 085758669690 atau Ketrinerianta9@gmail.com</p>
  <p>Buka setiap hari, 09.00–21.00 WIB.</p>
</footer>

<div class="overlay" id="overlay"></div>
<aside class="panel" id="panel" aria-label="Keranjang belanja">
  <div class="panel-head">
    <h2>Keranjang</h2>
    <button id="tutup" aria-label="Tutup keranjang">✕</button>
  </div>
  <ul id="daftar"></ul>
  <div class="panel-foot">
    <div class="total"><span>Total</span><strong id="total">Rp0</strong></div>
    <button class="btn full" id="checkout">Pesan via WhatsApp</button>
  </div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
// Data produk — ubah/tambah sesuai stok toko Anda
const produk = [
  {id:1, nama:"Kaos Katun Polos", kat:"baju", harga:89000, emoji:"👕", warna:"#cfe0ee", ukuran:["S","M","L","XL"]},
  {id:2, nama:"Kemeja Flanel Kotak", kat:"baju", harga:179000, emoji:"👔", warna:"#efd9b0", ukuran:["M","L","XL"]},
  {id:3, nama:"Hoodie Fleece", kat:"baju", harga:249000, emoji:"🧥", warna:"#d6d9e8", ukuran:["S","M","L","XL"]},
  {id:4, nama:"Jaket Denim", kat:"jaket", harga:329000, emoji:"🧥", warna:"#b7cbe0", ukuran:["M","L","XL"]},
  {id:5, nama:"Jaket Bomber", kat:"jaket", harga:359000, emoji:"🧥", warna:"#cdd8c6", ukuran:["S","M","L"]},
  {id:6, nama:"Jaket Parasut Anti Air", kat:"jaket", harga:289000, emoji:"🧥", warna:"#f0d2c4", ukuran:["M","L","XL"]}
];
const NO_WA = "6281200000000"; // ganti dengan nomor WhatsApp Anda (awali 62)

const rupiah = n => "Rp" + n.toLocaleString("id-ID");
let keranjang = [];
try { keranjang = JSON.parse(localStorage.getItem("keranjang")) || []; } catch(e){}
const pilihanUkuran = {};

const $ = id => document.getElementById(id);
const grid = $("grid"), panel = $("panel"), overlay = $("overlay");

function tampilProduk(kat = "semua"){
  grid.innerHTML = "";
  produk.filter(p => kat === "semua" || p.kat === kat).forEach(p => {
    pilihanUkuran[p.id] = pilihanUkuran[p.id] || p.ukuran[0];
    const el = document.createElement("article");
    el.className = "kartu";
    el.innerHTML = `
      <div class="foto" style="background:${p.warna}" aria-hidden="true">${p.emoji}</div>
      <div class="info">
        <h3>${p.nama}</h3>
        <small>${p.kat === "baju" ? "Baju" : "Jaket"}</small>
        <div class="ukuran">${p.ukuran.map(u =>
          `<button data-id="${p.id}" data-u="${u}" class="${u === pilihanUkuran[p.id] ? "pilih" : ""}">${u}</button>`).join("")}</div>
        <div class="harga">${rupiah(p.harga)}</div>
        <button class="tambah" data-tambah="${p.id}">Tambah ke keranjang</button>
      </div>`;
    grid.appendChild(el);
  });
}

grid.addEventListener("click", e => {
  const u = e.target.closest("[data-u]");
  if (u){
    pilihanUkuran[u.dataset.id] = u.dataset.u;
    u.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("pilih", b === u));
  }
  const t = e.target.closest("[data-tambah]");
  if (t) tambahKeKeranjang(+t.dataset.tambah);
});

$("filter").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#filter button").forEach(x => x.classList.toggle("aktif", x === b));
  tampilProduk(b.dataset.kat);
});

function tambahKeKeranjang(id){
  const p = produk.find(x => x.id === id), uk = pilihanUkuran[id];
  const ada = keranjang.find(i => i.id === id && i.ukuran === uk);
  ada ? ada.qty++ : keranjang.push({id, ukuran: uk, qty: 1});
  simpan(); toast(`${p.nama} (${uk}) masuk keranjang`);
}

function simpan(){
  try { localStorage.setItem("keranjang", JSON.stringify(keranjang)); } catch(e){}
  renderKeranjang();
}

function renderKeranjang(){
  const ul = $("daftar"); ul.innerHTML = "";
  let total = 0, jumlah = 0;
  if (!keranjang.length) ul.innerHTML = `<li class="kosong">Keranjang masih kosong. Pilih produk lalu tekan “Tambah ke keranjang”.</li>`;
  keranjang.forEach((i, idx) => {
    const p = produk.find(x => x.id === i.id);
    total += p.harga * i.qty; jumlah += i.qty;
    const li = document.createElement("li");
    li.innerHTML = `
      <div><strong>${p.nama}</strong><br><small>Ukuran ${i.ukuran} · ${rupiah(p.harga)}</small></div>
      <div>${rupiah(p.harga * i.qty)}</div>
      <div class="qty"><button data-k="-${idx}" aria-label="Kurangi">−</button>${i.qty}<button data-k="+${idx}" aria-label="Tambah">+</button></div>
      <button class="hapus" data-k="x${idx}">Hapus</button>`;
    ul.appendChild(li);
  });
  $("total").textContent = rupiah(total);
  $("jumlah").textContent = jumlah;
}

$("daftar").addEventListener("click", e => {
  const k = e.target.dataset.k; if (!k) return;
  const idx = +k.slice(1);
  if (k[0] === "+") keranjang[idx].qty++;
  else if (k[0] === "-") { if (--keranjang[idx].qty <= 0) keranjang.splice(idx, 1); }
  else keranjang.splice(idx, 1);
  simpan();
});

function bukaPanel(b){ panel.classList.toggle("buka", b); overlay.classList.toggle("buka", b); }
$("btnKeranjang").onclick = () => bukaPanel(true);
$("tutup").onclick = overlay.onclick = () => bukaPanel(false);
document.addEventListener("keydown", e => e.key === "Escape" && bukaPanel(false));

$("checkout").onclick = () => {
  if (!keranjang.length) return toast("Keranjang masih kosong");
  let total = 0;
  const baris = keranjang.map(i => {
    const p = produk.find(x => x.id === i.id); total += p.harga * i.qty;
    return `- ${p.nama} (${i.ukuran}) x${i.qty} = ${rupiah(p.harga * i.qty)}`;
  });
  const pesan = `Halo Lapis, saya ingin memesan:\n${baris.join("\n")}\nTotal: ${rupiah(total)}`;
  window.open(`https://wa.me/${NO_WA}?text=${encodeURIComponent(pesan)}`, "_blank");
};

let timer;
function toast(teks){
  const t = $("toast"); t.textContent = teks; t.classList.add("tampil");
  clearTimeout(timer); timer = setTimeout(() => t.classList.remove("tampil"), 2000);
}

tampilProduk(); renderKeranjang();
</script>
</body>
</html>
